name: ci

# Keeps Actions minutes low on a private repo:
# - every push runs linux test, lint and vuln
# - PRs add windows and macos tests (linux already ran on the branch push)
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        env:
          CGO_ENABLED: "1" # the race detector needs cgo
        run: go test -race ./...

  lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vuln:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # Proves the zero-network promise. jarx scan on the demo home runs inside a
  # network namespace with no network at all, under strace. The job fails on
  # any network syscall, even one that failed, because a connection attempt
  # that jarx quietly handled would otherwise still pass. --no-probe and
  # --no-history join the command when they exist (phases 4 and 6).
  offline:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NET_SYSCALLS: socket,socketpair,connect,bind,listen,accept,accept4,sendto,sendmsg,sendmmsg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: build
        run: go build -o "$RUNNER_TEMP/jarx" ./cmd/jarx
      - name: install strace
        run: command -v strace || (sudo apt-get update -qq && sudo apt-get install -y -qq strace)
      # Ubuntu blocks unprivileged user namespaces, so sudo makes the network
      # namespace and sudo -u drops straight back to the runner user. jarx
      # never runs as root.
      - name: control, no network and the syscall audit can see attempts
        run: |
          offline() { sudo unshare --net -- sudo -u "$(id -un)" -- "$@"; }
          if offline curl -sS --max-time 5 https://example.com -o /dev/null; then
            echo "network still works inside the namespace, so the offline check would prove nothing"
            exit 1
          fi
          offline strace -f -qq -o "$RUNNER_TEMP/control.trace" -e trace="$NET_SYSCALLS" \
            curl -sS --max-time 5 https://example.com -o /dev/null || true
          if ! grep -qE "^[0-9]+ +(${NET_SYSCALLS//,/|})\(" "$RUNNER_TEMP/control.trace"; then
            echo "strace didn't see curl's connection attempt, so the audit would miss jarx's too"
            exit 1
          fi
          echo "ok: no network, and the audit sees a connection attempt"
      - name: jarx scan --home testdata/demo, offline, with no network syscalls
        run: |
          offline() { sudo unshare --net -- sudo -u "$(id -un)" -- "$@"; }
          files() { git status --porcelain --ignored --untracked-files=all | sort; }
          before=$(files)
          out=$(offline strace -f -qq -o "$RUNNER_TEMP/jarx.trace" -e trace="$NET_SYSCALLS" \
            "$RUNNER_TEMP/jarx" scan --home testdata/demo)
          echo "$out"
          grep -q '^projects (3)$' <<<"$out"
          grep -q 'JARX-SECRET-001' <<<"$out"
          if grep -E "^[0-9]+ +(${NET_SYSCALLS//,/|})\(" "$RUNNER_TEMP/jarx.trace"; then
            echo "jarx made the network syscalls above during an offline scan"
            exit 1
          fi
          for planted in demo-not-a-real-token your-api-key-here; do
            if grep -qF "$planted" <<<"$out"; then
              echo "the scan printed the demo's planted secret $planted"
              exit 1
            fi
          done
          # The demo has secrets, so the scan makes its fingerprint key, and
          # nothing else anywhere in the checkout.
          wrote=$(comm -13 <(echo "$before") <(files))
          if [ "$wrote" != "!! testdata/demo/.jarx-state/fingerprint.key" ]; then
            echo "the demo scan should write only its fingerprint key, but wrote:"
            echo "$wrote"
            exit 1
          fi
          # A second scan reuses the key, so the fingerprints don't change.
          # Only the state dir line may differ: the dir exists now.
          key=$(sha256sum testdata/demo/.jarx-state/fingerprint.key)
          again=$(offline "$RUNNER_TEMP/jarx" scan --home testdata/demo)
          if [ "$key" != "$(sha256sum testdata/demo/.jarx-state/fingerprint.key)" ]; then
            echo "a second scan changed the fingerprint key"
            exit 1
          fi
          if ! grep -q '^  state dir .*(exists)$' <<<"$again"; then
            echo "the second scan doesn't show the state dir as existing"
            exit 1
          fi
          if ! diff <(grep -v '^  state dir ' <<<"$out") <(grep -v '^  state dir ' <<<"$again"); then
            echo "a second scan printed something different (diff above)"
            exit 1
          fi
