# Fake Codex config for the jarx demo home. Paths are read inside the fake
# home, so /projects/app means testdata/demo/projects/app.

# A permission profile that keeps keys and env files out of reach.
default_permissions = "locked"

# Planted: a typo. Someone meant Codex to ask before running commands, but
# Codex never sees approval_policy, so it keeps its default.
aproval_policy = "on-request"

# On native Windows, pin the MXC sandbox: the unelevated fallback doesn't
# support denied read paths, so the profile's denies would only be a hope.
# Pinning it also keeps the demo the same on every OS.
# Local memories are off by default. On here, so the memory file in
# memories/ goes into context and the secret rules check it.
[features]
memories = true

[windows]
sandbox = "mxc"

[projects."/projects/app"]
trust_level = "trusted"

[projects."/projects/notes"]
trust_level = "untrusted"

[permissions.locked]
extends = ":workspace"

[permissions.locked.filesystem]
"~/.ssh" = "deny"
"**/*.env" = "deny"

# Your own search server, sending a token from your env.
[mcp_servers.search]
url = "https://search.example.com/mcp"
bearer_token_env_var = "SEARCH_TOKEN"
