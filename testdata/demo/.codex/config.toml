# Fake Codex config for the jarx demo home. Paths are read inside the fake
# home, so /projects/app means testdata/demo/projects/app.

# A permission profile that keeps keys and env files out of reach.
default_permissions = "locked"

# Planted: a typo. Someone meant Codex to ask before running commands, but
# Codex never sees approval_policy, so it keeps its default.
aproval_policy = "on-request"

[projects."/projects/app"]
trust_level = "trusted"

[projects."/projects/notes"]
trust_level = "untrusted"

[permissions.locked]
extends = ":workspace"

[permissions.locked.filesystem]
"~/.ssh" = "deny"
"**/*.env" = "deny"
