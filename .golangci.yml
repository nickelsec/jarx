version: "2"

linters:
  default: all
  disable:
    # Deprecated; default: all still turns them on. Replaced by the _v5/_v2
    # versions handled below.
    - exhaustruct
    - wsl
    - gomodguard
    # depguard holds the approved module list, one guard is enough.
    - gomodguard_v2
    # Zero-value structs are idiomatic Go. Forcing every field makes code noisy.
    - exhaustruct_v5
    # Short names like r, w, tt are fine in small scopes.
    - varnamelen
    # Blank-line style. gofmt already decides formatting.
    - wsl_v5
    - nlreturn
    # The adapter design returns interfaces on purpose.
    - ireturn
    # Tests need unexported access, so they live in the same package.
    - testpackage
    # Many tests will use t.Setenv or shared fixture dirs, which can't run in
    # parallel. Parallel is opt-in, not required.
    - paralleltest
    - tparallel
    # `if err := f(); err != nil` is idiomatic.
    - noinlineerr
    # Errors with fmt.Errorf("...: %w") and context are fine; not everything
    # needs a sentinel.
    - err113
    # TODO comments are allowed; they get tracked in issues, not by lint.
    - godox
    # Long URLs in comments and doc links. gofmt handles code layout.
    - lll

  settings:
    depguard:
      rules:
        # Only stdlib, our own module and the deps approved in docs/prd.md.
        # A new import fails lint until it's approved and added here.
        approved:
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - github.com/nickelsec/jarx
            - github.com/BurntSushi/toml
            - github.com/zalando/go-keyring
            - github.com/klauspost/compress
            - modernc.org/sqlite
            - golang.org/x/sys

    misspell:
      # The unknown-settings tests misspell keys on purpose, often inside
      # raw strings where a nolint comment can't go.
      ignore-rules:
        - permisions
        - aproval

    forbidigo:
      analyze-types: true
      # Messages start with "network:" or "platform:" so the path exclusions
      # below can exempt exactly one group per choke point package.
      forbid:
        # Only internal/probe may read a server's raw launch spec (real env
        # values and tokens). model.Launch never prints or encodes it; this
        # keeps every other package from unwrapping it.
        - pattern: ^model\.Launch\.Spec$
          pkg: ^github\.com/nickelsec/jarx/internal/model$
          msg: "launch: only internal/probe may read a raw launch spec"
        # Only internal/discover may read credential metadata. CredentialFacts
        # is the one way past fsys's credential guard; it hands the file to
        # credmeta's parsers and returns their facts, never the bytes.
        - pattern: ^fsys\.FS\.CredentialFacts$
          pkg: ^github\.com/nickelsec/jarx/internal/fsys$
          msg: "credential: only internal/discover may read credential metadata"
        # Only internal/history may open a database, and it opens Codex's
        # SQLite read-only in place. The driver reads files itself, so it
        # only gets paths fsys.FS.DBPath checked, which is limited the same
        # way.
        - pattern: ^sql\.(Open|OpenDB)$
          pkg: ^database/sql$
          msg: "database: only internal/history may open a database"
        - pattern: ^fsys\.FS\.DBPath$
          pkg: ^github\.com/nickelsec/jarx/internal/fsys$
          msg: "database: only internal/history may open a database"
        # Only internal/netguard may build HTTP clients, transports or dialers.
        - pattern: ^http\.(Get|Post|Head|PostForm|DefaultClient|DefaultTransport|Client|Transport)$
          pkg: ^net/http$
          msg: "network: only internal/netguard may make HTTP clients or calls"
        - pattern: ^net\.(Dial|DialTimeout|DialTCP|DialUDP|DialIP|DialUnix|Dialer)$
          pkg: ^net$
          msg: "network: only internal/netguard may dial"
        - pattern: ^tls\.(Dial|DialWithDialer|Dialer|Client)$
          pkg: ^crypto/tls$
          msg: "network: only internal/netguard may open TLS connections"
        # A DNS lookup is a network call too.
        - pattern: ^net\.(Lookup[A-Za-z]*|Resolver|DefaultResolver)$
          pkg: ^net$
          msg: "network: only internal/netguard may do DNS lookups"
        - pattern: ^(smtp|rpc|jsonrpc)\..*$
          pkg: ^net/(smtp|rpc|rpc/jsonrpc)$
          msg: "network: only internal/netguard may make network calls"
        # Only internal/discover (hardened git) and internal/proc (MCP stdio
        # servers, in a job or process group) may run a process. exec.LookPath
        # reads the real PATH, so it's banned too; programs are found through
        # platform.Env instead.
        - pattern: ^exec\.(Command|CommandContext|LookPath)$
          pkg: ^os/exec$
          msg: "exec: only internal/discover and internal/proc may run commands"
        - pattern: ^os\.StartProcess$
          pkg: ^os$
          msg: "exec: only internal/discover and internal/proc may run commands"
        - pattern: ^syscall\.(Exec|ForkExec|StartProcess)$
          pkg: ^syscall$
          msg: "exec: only internal/discover and internal/proc may run commands"
        # Only internal/platform may read the real env and user dirs, so tests
        # and --home never touch the real machine.
        - pattern: ^os\.(Getenv|LookupEnv|Environ|ExpandEnv|UserHomeDir|UserConfigDir|UserCacheDir)$
          pkg: ^os$
          msg: "platform: read env and user dirs through internal/platform"
        - pattern: ^syscall\.(Getenv|Environ)$
          pkg: ^syscall$
          msg: "platform: read env through internal/platform"
        # Only internal/jarxdir may write files, and only inside jarx's state
        # dir. jarx never writes agent config. Tests may write fixtures.
        - pattern: ^os\.(WriteFile|Create|CreateTemp|OpenFile|Mkdir|MkdirAll|MkdirTemp|Remove|RemoveAll|Rename|Chmod|Chown|Lchown|Chtimes|Symlink|Link|Truncate)$
          pkg: ^os$
          msg: "write: only internal/jarxdir may write files"
        # Reads go through internal/fsys, which confines --home to the fake
        # home. Banning os.OpenRoot here also keeps os.Root's write methods
        # out of other packages.
        - pattern: ^os\.(Open|ReadFile|ReadDir|Stat|Lstat|Readlink|DirFS|OpenRoot|OpenInRoot)$
          pkg: ^os$
          msg: "read: read files through internal/fsys"
        - pattern: ^filepath\.(Walk|WalkDir)$
          pkg: ^path/filepath$
          msg: "read: walk files through internal/fsys"
        - pattern: ^ioutil\..*$
          pkg: ^io/ioutil$
          msg: "io: io/ioutil is deprecated, and its file calls skip fsys and jarxdir"
        # Only internal/report writes output, and it only takes redact.Text, so
        # a raw string can't reach the terminal or a log.
        - pattern: ^fmt\.(Print|Printf|Println|Fprint|Fprintf|Fprintln)$
          pkg: ^fmt$
          msg: "output: write output through internal/report"
        - pattern: ^os\.(Stdout|Stderr)$
          pkg: ^os$
          msg: "output: only cmd/jarx may use os.Stdout and os.Stderr, to hand them to report"
        - pattern: ^(print|println)$
          msg: "output: write output through internal/report"
        - pattern: ^log\..*$
          pkg: ^log$
          msg: "output: logging goes through internal/report"
        - pattern: ^slog\..*$
          pkg: ^log/slog$
          msg: "output: logging goes through internal/report"

  exclusions:
    rules:
      # Table tests repeat expected values by design.
      - path: _test\.go$
        linters:
          - goconst
      - path: ^internal/netguard/
        linters:
          - forbidigo
        text: "network:"
      - path: ^internal/platform/
        linters:
          - forbidigo
        text: "platform:"
      - path: ^internal/(fsys|jarxdir|platform)/
        linters:
          - forbidigo
        text: "read:"
      - path: ^internal/jarxdir/
        linters:
          - forbidigo
        text: "write:"
      - path: ^internal/report/
        linters:
          - forbidigo
        text: "output:"
      - path: ^cmd/jarx/
        linters:
          - forbidigo
        text: "output: only cmd/jarx may use os.Stdout"
      - path: ^internal/(discover|proc)/
        linters:
          - forbidigo
        text: "exec:"
      - path: ^internal/probe/
        linters:
          - forbidigo
        text: "launch:"
      - path: ^internal/discover/
        linters:
          - forbidigo
        text: "credential:"
      - path: ^internal/history/
        linters:
          - forbidigo
        text: "database:"
      # Tests build fixtures in t.TempDir() and check what got written.
      - path: _test\.go$
        linters:
          - forbidigo
        text: "(read|write|exec|launch|credential|database):"

# Show every issue on a line. By default golangci-lint keeps one per line,
# so another linter on the same line (gosec, unused) can hide a forbidigo
# ban message like "exec: only internal/discover may run commands".
issues:
  uniq-by-line: false
